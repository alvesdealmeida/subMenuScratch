<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎓 EDUC — Jogos Scratch + HTML + CSS + JS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #1e3a5f;
    --navy2:  #15294a;
    --teal:   #0ea5e9;
    --green:  #10b981;
    --cream:  #fef9f0;
    --white:  #ffffff;
    --text:   #1e293b;
    --muted:  #64748b;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(30,58,95,0.10);
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; overflow-y:scroll; }
  body {
    font-family:'Nunito', sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ══ MATRIX CANVAS ══ */
  #matrix-canvas {
    position:fixed; top:0; left:0;
    width:100vw; height:100vh;
    opacity:.5; pointer-events:none; z-index:0;
  }

  /* ══ HERO ══ */
  .hero {
    position:relative; overflow:hidden;
    padding:22px 28px 24px;
    background:#000; z-index:2;
    text-align:center;
  }
  .hero::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:radial-gradient(circle,rgba(0,255,65,.35) 0%,transparent 70%);
    z-index:10; animation:scanLine 3s ease-in-out infinite;
  }
  @keyframes scanLine { 0%,100%{opacity:.5} 50%{opacity:1;box-shadow:0 0 16px #00ff41} }

  .hero-inner {
    position:relative; z-index:5;
    max-width:1100px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    gap:18px; flex-wrap:wrap;
  }

  /* Logo */
  .hero-logo {
    height:58px; width:58px; border-radius:50%; object-fit:cover;
    border:2px solid rgba(0,255,65,.5);
    box-shadow:0 0 20px rgba(0,255,65,.35), 0 0 40px rgba(0,255,65,.15);
    flex-shrink:0;
    animation:logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%,100%{ box-shadow:0 0 16px rgba(0,255,65,.3), 0 0 32px rgba(0,255,65,.1); }
    50%{ box-shadow:0 0 28px rgba(0,255,65,.65), 0 0 56px rgba(0,255,65,.3); }
  }

  /* Nome da plataforma */
  .hero-brand { text-align:left; }
  .hero-brand-educ {
    display:block;
    font-size:2rem; font-weight:900;
    color:#00ff41; letter-spacing:.16em;
    text-shadow:0 0 18px rgba(0,255,65,.7), 0 0 40px rgba(0,255,65,.3);
    animation:glowPulse 2.5s ease-in-out infinite;
    line-height:1;
  }
  @keyframes glowPulse { 0%,100%{text-shadow:0 0 10px rgba(0,255,65,.4)} 50%{text-shadow:0 0 26px rgba(0,255,65,.85), 0 0 50px rgba(0,255,65,.4)} }
  .hero-brand-sub {
    display:block;
    font-size:.78rem; font-weight:700;
    color:rgba(255,255,255,.68);
    letter-spacing:.12em; text-transform:uppercase;
    margin-top:2px;
  }

  /* Divisor animado */
  .hero-divider {
    width:2px; height:52px; flex-shrink:0;
    background:linear-gradient(to bottom, transparent, rgba(0,255,65,.5), transparent);
  }

  /* Tecnologias badge */
  .hero-techs {
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
  }
  .tech-label {
    font-size:.6rem; font-weight:800; color:rgba(255,255,255,.45);
    letter-spacing:.14em; text-transform:uppercase; margin-bottom:2px;
  }
  .tech-badges { display:flex; gap:6px; flex-wrap:wrap; }
  .tech-badge {
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 10px; border-radius:20px;
    font-size:.68rem; font-weight:800;
    border:1px solid; white-space:nowrap;
    backdrop-filter:blur(6px);
  }
  .tb-scratch { background:rgba(255,148,0,.14); border-color:rgba(255,148,0,.45); color:#ffaa33; }
  .tb-html    { background:rgba(228,77,38,.14);  border-color:rgba(228,77,38,.45);  color:#ff7043; }
  .tb-css     { background:rgba(38,77,228,.14);  border-color:rgba(38,77,228,.45);  color:#7ca9ff; }
  .tb-js      { background:rgba(240,219,79,.14); border-color:rgba(240,219,79,.45); color:#f5e642; }

  /* ══ SEPARADOR ══ */
  .wave-sep { display:block; width:100%; height:8px; background:#e8e8ec; position:relative; z-index:2; }

  /* ══ MAIN ══ */
  .main { max-width:1300px; margin:0 auto; padding:40px 24px 80px; position:relative; z-index:2; }

  .section-heading {
    display:flex; align-items:center; gap:14px;
    margin-bottom:28px;
  }
  .section-heading h2 {
    font-family:'Playfair Display', serif;
    font-size:1.6rem; font-weight:700; color:var(--navy);
  }
  .section-heading .count-badge {
    font-size:.8rem; font-weight:800; color:var(--muted);
    background:var(--border); border-radius:20px; padding:4px 14px;
  }

  /* ══ GRID DE CARDS ══ */
  .games-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:22px;
  }

  /* ══ GAME CARD ══ */
  .game-card {
    background:rgba(255,255,255,.88);
    border-radius:22px; overflow:hidden;
    text-decoration:none; display:flex; flex-direction:column;
    box-shadow:0 2px 18px rgba(30,58,95,.09);
    border:2px solid transparent;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .28s, border-color .28s;
    animation:cardIn .45s ease both;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
    transform:translateY(-10px) scale(1.016);
    box-shadow:0 22px 54px rgba(30,58,95,.17);
    border-color:var(--card-accent, var(--teal));
  }
  .game-card:active { transform:scale(.98); }
  @keyframes cardIn { from{opacity:0;transform:translateY(26px) scale(.97)} to{opacity:1;transform:none} }

  /* Thumb */
  .card-thumb {
    height:130px; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .card-thumb::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.28) 100%);
  }
  .big-emoji {
    font-size:3.4rem;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.35));
    animation:emojiFloat var(--ef-dur,3.5s) ease-in-out infinite;
    animation-delay:var(--ef-dl,0s);
    position:relative; z-index:1;
  }
  @keyframes emojiFloat { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-10px) scale(1.08)} }

  .subject-badge {
    position:absolute; top:12px; left:12px; z-index:2;
    background:rgba(255,255,255,.18); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.32); color:#fff;
    border-radius:8px; font-size:.65rem; font-weight:800;
    padding:4px 10px; letter-spacing:.08em; text-transform:uppercase;
  }
  .play-tag {
    position:absolute; bottom:10px; right:10px; z-index:2;
    background:rgba(0,0,0,.38); backdrop-filter:blur(6px);
    color:rgba(255,255,255,.92); border-radius:20px;
    font-size:.68rem; font-weight:700; padding:3px 10px;
  }

  /* Body */
  .card-body { padding:16px 18px 15px; display:flex; flex-direction:column; flex:1; }
  .card-title { font-size:.94rem; font-weight:900; color:var(--navy); margin-bottom:7px; letter-spacing:-.01em; }
  .card-desc  { font-size:.83rem; font-weight:600; color:#94a3b8; line-height:1.55; flex:1; margin-bottom:16px;
                display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  /* Tech stack inline */
  .card-stack { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px; }
  .stack-chip {
    font-size:.6rem; font-weight:800; border-radius:12px;
    padding:2px 8px; border:1px solid;
  }
  .sc-scratch { background:rgba(255,148,0,.1); border-color:rgba(255,148,0,.4); color:#d97706; }
  .sc-html    { background:rgba(228,77,38,.1);  border-color:rgba(228,77,38,.4);  color:#c2410c; }
  .sc-css     { background:rgba(38,77,228,.1);  border-color:rgba(38,77,228,.4);  color:#3b5bdb; }
  .sc-js      { background:rgba(202,138,4,.1);  border-color:rgba(202,138,4,.4);  color:#a16207; }

  .card-footer { display:flex; align-items:center; justify-content:flex-end; }
  .card-btn {
    display:flex; align-items:center; gap:6px;
    background:var(--navy); color:#fff; border:none; border-radius:12px;
    padding:10px 20px; font-family:'Nunito',sans-serif;
    font-size:.84rem; font-weight:800; cursor:pointer;
    transition:background .2s, transform .18s;
    letter-spacing:.04em; min-height:44px;
    -webkit-tap-highlight-color:transparent;
  }
  .card-btn:hover { background:var(--teal); transform:scale(1.05); }
  .card-btn svg { width:13px; height:13px; fill:#fff; flex-shrink:0; }

  /* ══ EMPTY STATE ══ */
  .empty { text-align:center; padding:80px 20px; color:var(--muted); grid-column:1/-1; }
  .empty .empty-icon { font-size:3.5rem; display:block; margin-bottom:16px; }
  .empty h3 { font-size:1.2rem; font-weight:800; color:var(--navy); margin-bottom:8px; }

  /* ══ FOOTER ══ */
  footer {
    background:rgba(30,58,95,.95); color:rgba(255,255,255,.5);
    text-align:center; padding:28px 24px;
    font-size:.82rem; font-weight:700; letter-spacing:.04em;
    position:relative; z-index:2;
  }
  footer strong { color:rgba(255,255,255,.85); }
  footer a {
    color:var(--teal); text-decoration:none; font-size:.88rem;
    border:1px solid var(--teal); padding:5px 16px; border-radius:20px;
    display:inline-block; margin-top:10px; transition:background .2s;
  }
  footer a:hover { background:rgba(14,165,233,.15); }

  /* ══ RESPONSIVE — TABLET (≤1024px) ══ */
  @media (max-width:1024px) {
    .games-grid { grid-template-columns:repeat(3,1fr); gap:18px; }
  }

  /* ══ RESPONSIVE — TABLET PEQUENO (≤768px) ══ */
  @media (max-width:768px) {
    .hero { padding:18px 18px 20px; }
    .hero-inner { gap:14px; flex-wrap:wrap; justify-content:center; }
    .hero-logo { height:50px; width:50px; }
    .hero-brand { text-align:center; }
    .hero-brand-educ { font-size:1.7rem; }
    .hero-brand-sub  { font-size:.68rem; letter-spacing:.06em; }
    .hero-divider    { display:none; }
    .hero-techs      { align-items:center; }
    .tech-badges     { justify-content:center; }
    .games-grid      { grid-template-columns:repeat(2,1fr); gap:16px; }
    .main            { padding:28px 16px 64px; }
    .section-heading h2 { font-size:1.25rem; }
    .card-thumb      { height:115px; }
    .big-emoji       { font-size:3rem; }
    .card-body       { padding:14px 14px 12px; }
    .card-title      { font-size:.88rem; }
    .card-desc       { font-size:.80rem; }
  }

  /* ══ RESPONSIVE — CELULAR (≤480px) ══ */
  @media (max-width:480px) {
    .hero { padding:14px 12px 16px; }
    .hero-inner { gap:10px; }
    .hero-logo { height:42px; width:42px; }
    .hero-brand-educ { font-size:1.45rem; letter-spacing:.10em; }
    .hero-brand-sub  { font-size:.6rem; letter-spacing:.04em; }
    .hero-techs      { display:none; }
    .games-grid      { grid-template-columns:repeat(2,1fr); gap:12px; }
    .main            { padding:22px 12px 56px; }
    .section-heading { flex-wrap:wrap; gap:8px; margin-bottom:20px; }
    .section-heading h2 { font-size:1.1rem; }
    .card-thumb      { height:105px; }
    .big-emoji       { font-size:2.7rem; }
    .card-body       { padding:12px 12px 10px; }
    .card-title      { font-size:.84rem; }
    .card-desc       { font-size:.77rem; -webkit-line-clamp:2; }
    .card-stack      { gap:3px; }
    .stack-chip      { font-size:.55rem; padding:2px 6px; }
    .card-btn        { font-size:.78rem; padding:9px 14px; }
    footer           { padding:22px 16px; font-size:.76rem; }
  }

  /* ══ RESPONSIVE — CELULAR MUITO PEQUENO (≤360px) ══ */
  @media (max-width:360px) {
    .hero-brand-educ { font-size:1.25rem; }
    .hero-brand-sub  { font-size:.55rem; letter-spacing:.02em; }
    .games-grid      { grid-template-columns:1fr; }
    .card-thumb      { height:130px; }
    .big-emoji       { font-size:3.4rem; }
  }
</style>
</head>

function renderGames() {
  const grid = document.getElementById("gamesGrid");
  const lbl  = document.getElementById("count-label");
  lbl.textContent = games.length + (games.length === 1 ? " jogo" : " jogos");

  if (!games.length) {
    grid.innerHTML = `<div class="empty"><span class="empty-icon">🐱</span><h3>Nenhum jogo cadastrado ainda</h3><p>Em breve novos jogos serão adicionados!</p></div>`;
    return;
  }

  grid.innerHTML = games.map((g, i) => `
    <a class="game-card"
       href="${g.url}"
       target="_blank"
       rel="noopener"
       style="--card-accent:${g.accent}; animation-delay:${i * 0.08}s">
      <div class="card-thumb" style="background:${g.thumb}">
        <span class="big-emoji" style="--ef-dur:${3 + (i % 3) * 0.7}s; --ef-dl:${(i * 0.3) % 1.8}s">${g.emoji}</span>
        <span class="subject-badge">${g.badge}</span>
        <span class="play-tag">▶ Jogar agora</span>
      </div>
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="card-desc">${g.desc}</div>
        <div class="card-stack">
          <span class="stack-chip sc-scratch">🐱 Scratch</span>
          <span class="stack-chip sc-html">HTML</span>
          <span class="stack-chip sc-css">CSS</span>
          <span class="stack-chip sc-js">JavaScript</span>
        </div>
        <div class="card-footer">
          <button class="card-btn"
                  onclick="event.preventDefault(); window.open('${g.url}','_blank')">
            <svg viewBox="0 0 16 16"><path d="M6 3l6 5-6 5V3z"/></svg>
            Jogar
          </button>
        </div>
      </div>
    </a>
  `).join('');
}

renderGames();
</script>

<!-- Matrix Rain -->
<script>
(function initMatrix() {
  const canvas = document.getElementById('matrix-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]|/\\;:!@#$%^&*';
  const FS = 13;
  let cols, drops, W, H, iv;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cols  = Math.floor(W / FS);
    drops = Array.from({ length: cols }, () => Math.random() * -50);
  }
  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = FS + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const char = CHARS[Math.floor(Math.random() * CHARS.length)];
      const y = drops[i] * FS;
      if (drops[i] > 1 && Math.random() > 0.95) {
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 8;
      } else {
        const b = 80 + Math.floor(Math.random() * 100);
        ctx.fillStyle = `rgba(0,${b + 100},0,0.95)`; ctx.shadowColor = '#00ff41'; ctx.shadowBlur = 4;
      }
      ctx.fillText(char, i * FS, y);
      ctx.shadowBlur = 0;
      if (y > H && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 0.5 + Math.random() * 0.5;
    }
  }

  window.addEventListener('load', () => { resize(); iv = setInterval(draw, 40); });
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt); rt = setTimeout(() => { clearInterval(iv); resize(); iv = setInterval(draw, 40); }, 150);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInterval(iv);
    else { resize(); iv = setInterval(draw, 40); }
  });
})();
</script>
